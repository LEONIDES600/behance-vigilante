  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04-leo-visual";
      var DURATION = 3.5;
      var CENTER_X = 960;      // shared collapse centre
      var CENTER_Y = 549;

      var $ = function (id) { return document.getElementById(id); };
      var $$ = function (cls) { return Array.prototype.slice.call(document.querySelectorAll('[class~="' + cls + '"]')); };

      var tl = gsap.timeline({ paused: true });

      /* ---------- Phase 1 (0.0–0.7s): clear + collapse ---------- */
      // Inherited headline + labels fade out fast.
      tl.fromTo([$(ID + "-headline")].concat($$(ID + "-label")),
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        0);

      // scale-swap-transition (exit half): each screen rushes toward the
      // shared centre while shrinking to ~0 and fading, on power2.in.
      // The outer pair leads the inner pair by a hair.
      var EXIT_DUR = 0.4;
      var EXIT_SCALE = 0.02;
      var LEAD = 0.06;
      var screens = [
        { id: ID + "-screen-1", cx: 450,  start: 0.05 },
        { id: ID + "-screen-2", cx: 790,  start: 0.05 + LEAD },
        { id: ID + "-screen-3", cx: 1130, start: 0.05 + LEAD },
        { id: ID + "-screen-4", cx: 1470, start: 0.05 },
      ];
      screens.forEach(function (s) {
        tl.fromTo($(s.id),
          { x: 0, y: 0, scale: 1, opacity: 1 },
          { x: CENTER_X - s.cx, y: CENTER_Y - 549, scale: EXIT_SCALE, opacity: 0,
            duration: EXIT_DUR, ease: "power2.in" },
          s.start);
      });
      // Collapse completes by ~0.51s; the centre point sits empty on the bare grid until 0.6s.

      /* ---------- Phase 2 (0.6–2.0s): wordmark assembles letter by letter ---------- */
      // dynamic-content-sequencing: per-letter starts computed once from a
      // window + per-item config, never hardcoded per glyph.
      var letters = $$(ID + "-letter");
      var LETTERS_START = 0.6;
      var LETTER_DUR = 0.7;                       // long-tail settle per glyph
      var LETTERS_WINDOW_END = 2.0;
      var LETTER_STAGGER = (LETTERS_WINDOW_END - LETTERS_START - LETTER_DUR) / (letters.length - 1);
      var mid = (letters.length - 1) / 2;
      letters.forEach(function (el, i) {
        var at = LETTERS_START + i * LETTER_STAGGER;
        tl.fromTo(el,
          { opacity: 0, y: 46, x: (mid - i) * 9 },   // rises a short distance, drawn out of the centre
          { opacity: 1, y: 0, x: 0, duration: LETTER_DUR, ease: "expo.out" },
          at);
      });

      /* ---------- Phase 3 (1.8–2.4s): kicker · rule · URL ---------- */
      // Per-word staggered reveal of the kicker above the wordmark.
      var kwords = $$(ID + "-kword");
      var KICKER_START = 1.8;
      var KICKER_STAGGER = 0.07;
      kwords.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          KICKER_START + i * KICKER_STAGGER);
      });

      // 1.5px cobalt rule grows from its left edge to full width on a long-tail settle.
      tl.fromTo($(ID + "-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "expo.out" },
        1.85);

      // URL fades + slides a short distance up into place beneath the rule.
      tl.fromTo($(ID + "-url"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        2.0);

      /* ---------- Phase 4 (2.4–3.5s): the long hold ---------- */
      // Dead static to the final frame; no fade-out. Pad the timeline to the full duration.
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
