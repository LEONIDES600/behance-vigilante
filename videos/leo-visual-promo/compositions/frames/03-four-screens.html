      <!-- payoff headline -->

  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "03-four-screens";
      const root = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (sel) => Array.from(root.querySelectorAll(sel));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      // Screen geometry (handoff): 280×498, centers at (140, 249) inside each screen.
      const SCREEN_CX = 140, SCREEN_CY = 249;
      const DURATION = 6.5;

      /* ---------- Scene 1 (0.0–1.0s): chrome + the four outlines draw themselves (svg-path-draw) ---------- */
      const chrome = root.querySelector('#' + CSS.escape(ID + '-chrome'));
      tl.fromTo(chrome, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);

      const DRAW_DUR = 0.45, DRAW_STAGGER = 0.1, DRAW_START = 0.08;
      const FILL_DUR = 0.22;
      q('rect[data-draw]').forEach((r) => {
        const i = Number(r.dataset.draw);
        const measured = typeof r.getTotalLength === "function" ? r.getTotalLength() : 0;
        const len = (measured > 0 ? measured : 1550) * 1.02; // rect perimeter ≈ 2 × (278.5 + 496.5)
        r.style.strokeDasharray = String(len);
        r.style.strokeDashoffset = String(len);
        const at = DRAW_START + i * DRAW_STAGGER;
        tl.fromTo(r, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" }, at);
        // paper-2 fill fades in as each outline closes
        const fill = root.querySelector('[data-fill="' + i + '"]');
        tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: FILL_DUR, ease: "power1.out" }, at + DRAW_DUR - 0.05);
      });

      /* ---------- dynamic-content-sequencing: content-driven starts, pre-computed once ---------- */
      // Reduces an array of {text|len, ...} into a flat TIMELINE of {start, end}; durations grow with content length.
      function sequence(items, base, perUnit) {
        let cumulative = 0;
        return items.map((entry) => {
          const dur = base + entry.len * perUnit;
          const start = cumulative;
          cumulative += dur;
          return { ...entry, start, end: cumulative, total: cumulative };
        });
      }
      // Map the computed starts into a Scene window [winStart, winStart + span] (longer words earn longer gaps).
      function fitStarts(timeline, winStart, span) {
        const last = timeline[timeline.length - 1].start || 1;
        return timeline.map((e) => ({ ...e, at: winStart + (e.start / last) * span }));
      }

      /* ---------- Scene 2 (1.0–1.8s): channel labels, per-word staggered reveal left→right ---------- */
      const labels = q('[data-label]').sort((a, b) => Number(a.dataset.label) - Number(b.dataset.label));
      const LABEL_REVEAL = 0.35;
      const labelSeq = fitStarts(
        sequence(labels.map((el) => ({ el, len: el.textContent.trim().length })), 0.12, 0.012),
        1.0, 0.8 - LABEL_REVEAL
      );
      labelSeq.forEach((e) => {
        tl.fromTo(e.el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: LABEL_REVEAL, ease: "power2.out" }, e.at);
      });

      /* ---------- center-outward-expansion (short-path form) — per-screen item stagger-assemble ---------- */
      const START_PROGRESS = 0.5; // partially-spread start: half the path to the slot
      const EXPAND_EASE = "power3.out";
      function prepItems(burstIndex) {
        const wrap = root.querySelector('[data-burst="' + burstIndex + '"]');
        return Array.from(wrap.querySelectorAll('[data-box]')).map((el) => {
          const [x, y, w, h] = el.dataset.box.split(/\s+/).map(Number);
          el.style.width = w + "px";
          el.style.height = h + "px";
          return { el, tx: x + w / 2 - SCREEN_CX, ty: y + h / 2 - SCREEN_CY };
        });
      }
      function burst(item, at, dur, ease, scaleFrom) {
        tl.fromTo(
          item.el,
          { xPercent: -50, yPercent: -50, x: item.tx * START_PROGRESS, y: item.ty * START_PROGRESS, scale: scaleFrom, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: item.tx, y: item.ty, scale: 1, opacity: 1, duration: dur, ease: ease },
          at
        );
      }

      /* ---------- Scene 3 (1.8–2.6s): screen 1 (Instagram) populates ---------- */
      prepItems(0).forEach((item, i) => burst(item, 1.8 + i * 0.06, 0.5, EXPAND_EASE, 0.7));

      /* ---------- Scene 4 (2.6–3.4s): screen 2 (TikTok) populates ---------- */
      const field = root.querySelector('[data-field="1"]');
      tl.fromTo(field, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 2.6);
      prepItems(1).forEach((item, i) => burst(item, 2.65 + i * 0.06, 0.5, EXPAND_EASE, 0.7));

      /* ---------- Scene 5 (3.4–4.2s): screen 3 (LinkedIn) populates ---------- */
      const liItems = prepItems(2);
      const author = liItems.find((it) => it.el.dataset.role === "author");
      const attachment = liItems.find((it) => it.el.dataset.role === "attachment");
      burst(author, 3.4, 0.45, EXPAND_EASE, 0.7);
      // five text bars type on line by line — starts computed from each bar's width (content length)
      const tbars = q('[data-tbar]').sort((a, b) => Number(a.dataset.tbar) - Number(b.dataset.tbar));
      const tbarSeq = sequence(tbars.map((el) => ({ el, len: parseFloat(el.style.width) })), 0.03, 0.0004);
      const TBAR_AT = 3.5;
      tbarSeq.forEach((e) => {
        tl.fromTo(e.el, { scaleX: 0 }, { scaleX: 1, duration: e.end - e.start, ease: "none" }, TBAR_AT + e.start);
      });
      burst(attachment, 3.95, 0.25, EXPAND_EASE, 0.7);

      /* ---------- Scene 6 (4.2–5.0s): screen 4 (YouTube) populates ---------- */
      const ytItems = prepItems(3);
      ytItems.forEach((item, i) => {
        if (item.el.dataset.role === "thumb") {
          burst(item, 4.2, 0.7, "back.out(1.7)", 0.6); // pop-in on a long-tail settle
        } else {
          burst(item, 4.4 + (i - 1) * 0.1, 0.45, EXPAND_EASE, 0.7);
        }
      });

      /* ---------- Scene 7 (5.0–5.9s): payoff headline, per-word staggered reveal ---------- */
      const words = q('[data-word]').sort((a, b) => Number(a.dataset.word) - Number(b.dataset.word));
      const WORD_REVEAL = 0.5;
      const wordSeq = fitStarts(
        sequence(words.map((el) => ({ el, len: el.textContent.trim().length })), 0.2, 0.03),
        5.0, 0.9 - WORD_REVEAL
      );
      wordSeq.forEach((e) => {
        tl.fromTo(e.el, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: WORD_REVEAL, ease: "power3.out" }, e.at);
      });

      /* ---------- Scene 8 (5.9–6.5s): held read — dead still at the handoff geometry ---------- */
      tl.set({}, {}, DURATION);
    })();
  </script>
